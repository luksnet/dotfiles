# Gruvbox dla Home Assistant (akcent: aqua).
# Plik w HA: /config/themes/gruvbox.yaml (folder themes obok configuration.yaml).
# Po zmianie: Narzędzia deweloperskie → Akcje → frontend.reload_themes.
Gruvbox:
  # wspólne dla obu trybów
  ha-card-border-radius: "10px"
  success-color: "#b8bb26"
  warning-color: "#fabd2f"
  error-color: "#fb4934"
  info-color: "#83a598"
  modes:
    dark:
      primary-color: "#8ec07c"
      accent-color: "#8ec07c"
      rgb-primary-color: "142, 192, 124"
      rgb-accent-color: "142, 192, 124"
      text-primary-color: "#1d2021"   # tekst na przyciskach w kolorze akcentu
      primary-background-color: "#1d2021"
      secondary-background-color: "#282828"
      card-background-color: "#282828"
      ha-card-background: "#282828"
      ha-card-border-color: "#3c3836"
      primary-text-color: "#ebdbb2"
      secondary-text-color: "#a89984"
      disabled-text-color: "#665c54"
      divider-color: "#3c3836"
      app-header-background-color: "#282828"
      app-header-text-color: "#ebdbb2"
      sidebar-background-color: "#1d2021"
      sidebar-text-color: "#d5c4a1"
      sidebar-icon-color: "#a89984"
      sidebar-selected-icon-color: "#8ec07c"
      sidebar-selected-text-color: "#8ec07c"
      state-icon-color: "#83a598"
      # włączone światła i urządzenia zostają żółte: od razu widać, co działa
      state-active-color: "#fabd2f"
      paper-item-icon-color: "#83a598"
      paper-item-icon-active-color: "#fabd2f"
      code-editor-background-color: "#1d2021"
      input-fill-color: "#32302f"
      mdc-theme-surface: "#282828"
    light:
      primary-color: "#427b58"
      accent-color: "#427b58"
      rgb-primary-color: "66, 123, 88"
      rgb-accent-color: "66, 123, 88"
      text-primary-color: "#fbf1c7"
      primary-background-color: "#f9f5d7"
      secondary-background-color: "#fbf1c7"
      card-background-color: "#fbf1c7"
      ha-card-background: "#fbf1c7"
      ha-card-border-color: "#ebdbb2"
      primary-text-color: "#3c3836"
      secondary-text-color: "#7c6f64"
      disabled-text-color: "#bdae93"
      divider-color: "#ebdbb2"
      app-header-background-color: "#fbf1c7"
      app-header-text-color: "#3c3836"
      sidebar-background-color: "#f9f5d7"
      sidebar-text-color: "#504945"
      sidebar-icon-color: "#7c6f64"
      sidebar-selected-icon-color: "#427b58"
      sidebar-selected-text-color: "#427b58"
      state-icon-color: "#076678"
      state-active-color: "#b57614"
      paper-item-icon-color: "#076678"
      paper-item-icon-active-color: "#b57614"
      code-editor-background-color: "#f9f5d7"
      input-fill-color: "#f2e5bc"
      mdc-theme-surface: "#fbf1c7"
