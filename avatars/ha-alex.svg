<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Awatar użytkownika Alex w Home Assistant: litera A jako dach domu. Kolory Gruvbox. -->
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="70%">
      <stop offset="0" stop-color="#32302f"/>
      <stop offset="1" stop-color="#1d2021"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>

  <!-- komin: rysowany pod dachem, żeby dół chował się pod ramieniem A -->
  <rect x="300" y="150" width="34" height="110" rx="6" fill="#d65d0e"/>
  <!-- litera A, której ramiona tworzą dach -->
  <path d="M136 384L256 120L376 384" fill="none" stroke="#fe8019" stroke-width="44"
        stroke-linecap="round" stroke-linejoin="round"/>
  <!-- poprzeczka A jako okap / podłoga domu -->
  <path d="M188 300H324" stroke="#ebdbb2" stroke-width="30" stroke-linecap="round"/>
  <!-- okno pod dachem -->
  <rect x="236" y="214" width="40" height="40" rx="6" fill="#fabd2f"/>
</svg>
