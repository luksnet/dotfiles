# tmux: Gruvbox Material (bez wtyczek)
# Prefiks Ctrl+Spacja, mysz, numeracja od 1, jak w poprzedniej wersji z 2023.

set -g default-terminal "tmux-256color"
set -sa terminal-overrides ",xterm*:Tc,alacritty:Tc,konsole*:Tc"
set -g mouse on
set -g history-limit 50000
set -sg escape-time 10
set -g focus-events on

set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# podział w bieżącym katalogu: | i -
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
bind r source-file ~/.config/tmux/tmux.conf \; display "tmux.conf wczytany"

# --- Kolory ----------------------------------------------------------------
# bg0 #282828  bg1 #32302f  bg3 #45403d  fg0 #d4be98  grey0 #7c6f64
# aqua #89b482  yellow #d8a657  red #ea6962  purple #d3869b
set -g status-position bottom
set -g status-style "bg=#32302f,fg=#d4be98"
set -g status-left-length 30
set -g status-left "#[bg=#89b482,fg=#282828,bold] #S #[bg=#32302f] "
set -g status-right "#[fg=#7c6f64]#{?client_prefix,#[fg=#d8a657]PREFIX ,}#[fg=#a89984]%H:%M #[bg=#45403d,fg=#d4be98] #h "
setw -g window-status-format "#[fg=#7c6f64] #I #W "
setw -g window-status-current-format "#[bg=#45403d,fg=#d8a657,bold] #I #W#{?window_zoomed_flag, 󰊓,} "
setw -g window-status-separator ""
set -g pane-border-style "fg=#45403d"
set -g pane-active-border-style "fg=#89b482"
set -g message-style "bg=#45403d,fg=#d4be98"
set -g mode-style "bg=#45403d,fg=#d8a657"
setw -g clock-mode-colour "#89b482"
