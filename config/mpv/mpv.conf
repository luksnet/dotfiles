# mpv: Gruvbox Material + Hack (bez wtyczek, tylko wbudowane OSD/OSC)
# kolory: bg0 #282828  bg1 #32302F  grey #7C6F64  fg #D4BE98
#         aqua #89B482  yellow #D8A657  red #EA6962

# OSD (komunikaty, pasek głośności, statystyki)
osd-font = "Hack"
osd-font-size = 30
osd-color = "#D4BE98"
osd-border-color = "#1D2021"
osd-border-size = 2
osd-back-color = "#00000000"
osd-shadow-offset = 0
osd-bar-align-y = 0.85
osd-bar-h = 2
osd-bar-w = 60
osd-selected-color = "#D8A657"
osd-selected-outline-color = "#1D2021"
osd-playing-msg-duration = 3000

# napisy: kolor Gruvbox, ale zwykła czcionka zostaje czytelna
sub-color = "#D4BE98"
sub-border-color = "#1D2021"
sub-border-size = 3
sub-shadow-offset = 0

# tło wokół obrazu (letterbox) i ekran bez pliku
background-color = "#1D2021"
